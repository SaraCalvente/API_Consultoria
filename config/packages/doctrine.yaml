parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        # configure these for your database server
        driver: 'pdo_mysql'
        server_version: '8.4'
        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci

        url: '%env(resolve:DATABASE_URL)%'
        types:
            email_vo: App\Shared\Infraestructure\Persistence\EmailType

    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
#            App:
#                is_bundle: false
#                type: attribute
#                dir: '%kernel.project_dir%/src/Entity'
#                prefix: 'App\Entity'
#                alias: App
            User:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/User/Domain'
                prefix: 'App\User\Domain'
                alias: User
            Consultant:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Consultant/Domain'
                prefix: 'App\Consultant\Domain'
                alias: Consultant
            Project:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Project/Domain'
                prefix: 'App\Project\Domain'
                alias: Project
            Client:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Client/Domain'
                prefix: 'App\Client\Domain'
                alias: Client
            ActivityHistory:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/ActivityHistory/Domain'
                prefix: 'App\ActivityHistory\Domain'
                alias: ActivityHistory
        filters:
            softdeleteable:
                class: Gedmo\SoftDeleteable\Filter\SoftDeleteableFilter
                enabled: true

when@test:
    doctrine:
        dbal:
            # configure these for your database server
            driver: 'pdo_mysql'
            server_version: '8.4'
            charset: utf8mb4
            default_table_options:
                charset: utf8mb4
                collate: utf8mb4_unicode_ci

            dbname: 'demo-test'
            host: 'demo-mysql-test'
            port: '3306'
            user: 'demo'
            password: 'demo'

            url: '%env(resolve:DATABASE_URL_TEST)%'

        orm:
            auto_mapping: true